name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop  # develop 브랜치에 push할 때 자동 배포
  workflow_dispatch:  # 수동으로도 실행 가능

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'  # 최신 LTS 버전 자동 사용
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_KAKAO_MAP_API_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_API_KEY }}
        run: |
          npm run build-static
          npm run postbuild-static

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: www.teoconf.com
